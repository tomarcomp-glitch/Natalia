<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17594A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Delícias Caseiras da Naty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F4F1;--card:#fff;--ink:#1E2B28;--mut:#5F6E69;--brand:#17594A;--onbrand:#fff;--gold:#D69A1E;--bad:#B3382C;--line:#D9DFDB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1B2522;--ink:#E8EEEB;--mut:#96A59F;--brand:#4DB89E;--onbrand:#0c1512;--gold:#E3B04B;--bad:#E2766B;--line:#2C3A36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121917;--card:#1B2522;--ink:#E8EEEB;--mut:#96A59F;--brand:#4DB89E;--onbrand:#0c1512;--gold:#E3B04B;--bad:#E2766B;--line:#2C3A36;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:800;margin:0;padding:12px 16px 4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
main{max-width:820px;margin:0 auto;padding:16px}
h2{font-size:17px;font-weight:600;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
summary{cursor:pointer}details[open]>summary{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:24px;font-weight:800}.stat span,.mut{color:var(--mut);font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label{display:block;font-size:12px;color:var(--mut)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
button.b{font:inherit;font-weight:600;background:var(--brand);color:var(--onbrand);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button.l{font:inherit;background:none;border:0;color:var(--bad);cursor:pointer;padding:4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:400}
.tag{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;background:var(--line)}
.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:var(--brand);color:var(--onbrand)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:40;max-width:90%}
.row>*{min-width:0}
input,select{min-height:48px;font-size:16px;padding:10px 12px}
button.b{min-height:50px;font-size:16px;padding:12px 16px}
button.l{min-height:46px;padding:8px 12px;font-size:15px}
nav button{min-height:44px;padding:9px 16px}
summary{padding:8px 0}
label{margin:2px 0 4px}
.ing{padding:12px 0;border-bottom:1px solid var(--line)}
.ing .f{display:flex;gap:8px;align-items:center;margin-top:4px}
.ing .f input{flex:1;width:auto}
.ing .f .u{color:var(--mut);white-space:nowrap}
.ing .f .c{font-weight:600;white-space:nowrap}
.lin{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:10px}.row>button{width:100%}main{padding:12px}.card{padding:12px}}
button.s{font:inherit;font-weight:600;background:none;border:1px solid var(--brand);color:var(--brand);border-radius:8px;padding:8px 14px;min-height:46px;cursor:pointer}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acoes>button:only-child{grid-column:1/-1}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.sh-h b{font-size:18px}
.sh-h button{font:inherit;min-height:46px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
#sheet-b{max-width:640px;margin:0 auto;padding:14px 14px 8px}
#sheet-f{max-width:640px;margin:0 auto;padding:0 14px 48px}
.ft tr.novo td{border-top:2px dashed var(--line)}
#sheet .row{grid-template-columns:1fr}
#sheet .row>button{width:100%}
.ft{width:100%}
.ft th{font-size:12px}
.ft td{white-space:normal;vertical-align:middle}
.ft td:first-child{min-width:112px}
.ft td:nth-child(2){white-space:nowrap}
.ft select,.ft input{min-height:42px;padding:6px 8px}
.ft select{width:100%;min-width:0}
.ft input{width:72px}
.ft tr.total td{font-weight:700;border-top:2px solid var(--line);white-space:normal}
</style>
</head>
<body>
<header><h1>Delícias Caseiras da Naty</h1><nav id="nav"></nav></header>
<main id="v"></main>
<div id="toast" role="status"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sh-h"><button onclick="fechar()">‹ Voltar</button><b id="sheet-t"></b></div><div id="sheet-b"></div><div id="sheet-f"></div></div>
<script>
const K="meuforno.v1",EMPTY=()=>({insumos:[],mov:[],prod:[],producoes:[],vendas:[],plano:{}});
let S=EMPTY();try{const r=localStorage.getItem(K);if(r)S=Object.assign(EMPTY(),JSON.parse(r))}catch(e){}
let ab={},tab="painel",dir=null,bkMsg="Nenhuma pasta escolhida.",needPerm=false,timer;
const $=i=>document.getElementById(i),g=i=>$(i).value,n=i=>parseFloat(String(g(i)).replace(",","."))||0;
const uid=()=>Math.random().toString(36).slice(2,9);
const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=v=>(Math.round((v||0)*100)/100).toLocaleString("pt-BR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dt=d=>d.split("-").reverse().join("/");
const ins=id=>S.insumos.find(i=>i.id===id),pr=id=>S.prod.find(p=>p.id===id);
const saldo=id=>S.mov.filter(m=>m.i===id).reduce((a,m)=>a+m.q,0);
const pronto=id=>S.producoes.filter(p=>p.p===id).reduce((a,p)=>a+p.q,0)-S.vendas.filter(v=>v.p===id&&v.st!=="ag").reduce((a,v)=>a+v.q,0);
const custoProd=p=>p.f.reduce((a,x)=>a+x.q*((ins(x.i)||{}).custo||0),0)/(p.r||1);
const opts=(l,f)=>l.map(x=>`<option value="${x.id}">${esc(f(x))}</option>`).join("");
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",3200)}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(timer);timer=setTimeout(fazerBackup,500);render();if(sheet&&!sheet.keep)fechar()}

/* ---------- Backup ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("meuforno",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function hput(h){const d=await idb();d.transaction("h","readwrite").objectStore("h").put(h,"dir")}
async function hget(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction("h").objectStore("h").get("dir");q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function escolherPasta(){
  if(!window.showDirectoryPicker){bkMsg="Este navegador não permite escolher pasta. Use “Baixar backup”. No Chrome ou Edge no computador, a pasta funciona.";return render()}
  try{dir=await showDirectoryPicker({mode:"readwrite"});needPerm=false;try{await hput(dir)}catch(e){}await fazerBackup()}
  catch(e){bkMsg=e.name==="AbortError"?"Escolha de pasta cancelada.":"Não foi possível usar a pasta: "+e.message}
  render()}
async function reativar(){try{if(await dir.requestPermission({mode:"readwrite"})==="granted"){needPerm=false;await fazerBackup()}}catch(e){bkMsg=e.message}render()}
async function fazerBackup(){
  if(!dir)return;
  try{
    if(await dir.queryPermission({mode:"readwrite"})!=="granted"){needPerm=true;bkMsg="A permissão da pasta expirou. Toque em “Reativar pasta”.";return rendBk()}
    const js=JSON.stringify(S,null,1);
    for(const nm of ["backup-meu-forno-atual.json","backup-meu-forno-"+hoje()+".json"]){const f=await dir.getFileHandle(nm,{create:true}),w=await f.createWritable();await w.write(js);await w.close()}
    marcaBk();bkMsg="Último backup automático: "+new Date().toLocaleString("pt-BR")+" na pasta “"+dir.name+"”."
  }catch(e){bkMsg="Falha no backup: "+e.message}
  rendBk()}
function baixar(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="backup-meu-forno-"+hoje()+".json";a.click();marcaBk();toast("Backup baixado.");render()}
function restaurar(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(EMPTY(),JSON.parse(r.result));save();toast("Dados restaurados.")}catch(e){toast("Arquivo inválido.")}};r.readAsText(f)}

/* ---------- Ações ---------- */
function addInsumo(){const nome=g("in").trim();if(!nome)return toast("Informe o nome do item.");S.insumos.push({id:uid(),nome,un:g("iu"),min:n("im"),custo:n("ic")});save()}
function movimento(){const i=g("mi");if(!i)return toast("Cadastre um item primeiro.");const t=g("mt"),v=n("mq");if(v<0||(t!=="c"&&v===0))return toast("Informe a quantidade.");
  let q=t==="e"?v:t==="s"?-v:v-saldo(i);
  if(t==="e"&&n("mc")>0)ins(i).custo=n("mc");
  S.mov.push({id:uid(),i,q,d:hoje(),o:g("mo")||({e:"Entrada",s:"Saída",c:"Contagem"})[t],t,c:t==="e"&&n("mc")>0?n("mc"):undefined});save()}
function delInsumo(id){if(S.mov.some(m=>m.i===id)||S.prod.some(p=>p.f.some(x=>x.i===id)))return toast("Item com movimentos ou usado em ficha não pode ser excluído.");S.insumos=S.insumos.filter(i=>i.id!==id);save()}
function addProd(){const nome=g("pn").trim();if(!nome)return toast("Informe o nome do produto.");const id=uid();ab[id]=true;S.prod.push({id,nome,preco:n("pp"),r:n("pr")||1,f:[]});save();abrirFicha(id)}
function addFicha(p){const i=g("fi"+p),q=n("fq"+p);if(!i||q<=0)return toast("Escolha o item e a quantidade.");const pd=pr(p),x=pd.f.find(a=>a.i===i);x?x.q+=q:pd.f.push({i,q});save()}
function delFicha(p,i){const pd=pr(p);pd.f=pd.f.filter(x=>x.i!==i);save()}
function editProd(id,k,v){const p=pr(id);if(k==="nome"){v=v.trim();if(!v){toast("O nome não pode ficar vazio.");return render()}}else{v=parseFloat(String(v).replace(",","."))||0;if(k==="r"&&v<=0){toast("O rendimento deve ser maior que zero.");return render()}}p[k]=v;save()}
function editQtd(p,i,v){v=parseFloat(String(v).replace(",","."))||0;if(v<=0){toast("A quantidade deve ser maior que zero.");return render()}pr(p).f.find(a=>a.i===i).q=v;save()}
const compra=m=>m.q>0&&!m.ref&&m.t!=="c"&&m.t!=="s"&&m.o!=="Contagem";
let nCompras=30;
const mais=()=>{nCompras+=30;render()};
function trocaIng(p,a,b){if(a===b)return;const pd=pr(p),cur=pd.f.find(x=>x.i===a),ex=pd.f.find(x=>x.i===b);if(!cur)return;
  if(ex){ex.q+=cur.q;pd.f=pd.f.filter(x=>x!==cur);toast("Esse ingrediente já estava na ficha: quantidades somadas.")}else cur.i=b;save()}
let nMov=20,nProd=20;
const maisMov=()=>{nMov+=20;render()},maisProd=()=>{nProd+=20;render()};
function delMov(id){const m=S.mov.find(a=>a.id===id);if(!m)return;
  if(m.ref)return toast("Este movimento vem de uma produção. Corrija na aba Produção.");
  if(saldo(m.i)-m.q<-1e-9)return toast("Não dá para excluir: o estoque ficaria negativo.");
  S.mov=S.mov.filter(a=>a.id!==id);save()}
const BK="meuforno.bk";
const ultBk=()=>{try{return localStorage.getItem(BK)||""}catch(e){return ""}};
const marcaBk=()=>{try{localStorage.setItem(BK,hoje())}catch(e){}};
const diasBk=()=>{const u=ultBk();return u?Math.max(0,Math.floor((new Date(hoje())-new Date(u))/864e5)):null};
function avisoBk(){if(!(S.vendas.length||S.mov.length||S.prod.length))return "";const d=diasBk();if(d!==null&&d<7)return "";
  return `<div class="card" style="border-color:var(--gold)"><b>Faça um backup</b><div class="mut" style="margin:4px 0 10px">${d===null?"Você ainda não baixou nenhum backup neste aparelho.":"Seu último backup foi há "+d+" dias."} Se o celular for trocado ou o navegador for limpo, os dados podem sumir.</div><button class="b" style="width:100%" onclick="baixar()">Baixar backup agora</button></div>`}
function graficoMeses(){const h=hoje(),y=+h.slice(0,4),m0=+h.slice(5,7)-1,NM=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],ms=[];
  for(let i=5;i>=0;i--){const d=new Date(y,m0-i,1),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    ms.push({k,r:NM[d.getMonth()],v:S.vendas.filter(x=>x.st!=="ag"&&x.d.slice(0,7)===k).reduce((a,x)=>a+x.q*x.pv,0)})}
  const mx=Math.max(...ms.map(o=>o.v),1),W=300,H=150,bw=34,gap=(W-6*bw)/7;
  const bars=ms.map((o,i)=>{const x=gap+i*(bw+gap),hh=Math.round(o.v/mx*100),y0=120-hh;return `<g><rect x="${x}" y="${y0}" width="${bw}" height="${hh}" rx="4" fill="var(--brand)" opacity="${i===5?1:.55}"/><text x="${x+bw/2}" y="${y0-5}" text-anchor="middle" font-size="10" fill="var(--ink)">${o.v?Math.round(o.v):""}</text><text x="${x+bw/2}" y="138" text-anchor="middle" font-size="11" fill="var(--mut)">${o.r}</text></g>`}).join("");
  const a=ms[5].v,b=ms[4].v,dif=b?Math.round((a-b)/b*100):null;
  return `<h2>Vendas por mês</h2><div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Vendas dos últimos 6 meses">${bars}</svg><div class="mut">Este mês ${brl(a)} · mês anterior ${brl(b)}${dif===null?"":" · "+(dif>=0?"+":"")+dif+"%"}</div></div>`}
let fv={q:"",per:"todas",st:"todas"},nVend=30;
const vendaCard=v=>`<div style="border-bottom:1px solid var(--line);padding:8px 0"><b>${esc((pr(v.p)||{nome:"?"}).nome)}</b> · ${num(v.q)} un. · <b>${brl(v.q*v.pv)}</b> <span class="tag ${v.st==="ag"?"":v.pg===false?"bad":"ok"}">${v.st==="ag"?"Agendada":v.pg===false?"A receber":"Pago"}</span><div class="mut">${v.cli?esc(v.cli)+" · ":""}Encomenda ${dt(v.d)}${v.de?" · Entrega "+dt(v.de):""} · ${esc(v.fp||"—")}</div>${v.st==="ag"?`<div class="row" style="margin-top:6px"><div><label>Forma de pagamento</label><select id="fp${v.id}">${["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Outro"].map(x=>`<option${x===v.fp?" selected":""}>${x}</option>`).join("")}</select></div><button class="b" onclick="concluir('${v.id}',true)">Concluir e marcar pago</button><button class="b" onclick="concluir('${v.id}',false)">Concluir, a receber</button></div>`:`<button class="l" style="color:var(--brand)" onclick="togglePago('${v.id}')">${v.pg===false?"Marcar como pago":"Marcar como não pago"}</button>`}<button class="l" onclick="delVenda('${v.id}')">${v.st==="ag"?"Cancelar encomenda":"Desfazer"}</button></div>`;
const vresRefresh=()=>{const e=$("vres");if(e)e.innerHTML=vendasLista()};
const fvSet=(k,v)=>{fv[k]=v;nVend=30;vresRefresh()};
const maisVend=()=>{nVend+=30;vresRefresh()};
function vendasLista(){const h=hoje(),sem=new Date(Date.now()-new Date().getTimezoneOffset()*6e4-6*864e5).toISOString().slice(0,10),q=fv.q.trim().toLowerCase();
  const ok=v=>{const dia=v.st==="ag"&&v.de?v.de:v.d;
    if(q&&!((v.cli||"").toLowerCase().includes(q)||(pr(v.p)||{nome:""}).nome.toLowerCase().includes(q)))return false;
    if(fv.per==="hoje"&&dia!==h)return false;if(fv.per==="sem"&&dia<sem)return false;if(fv.per==="mes"&&dia.slice(0,7)!==h.slice(0,7))return false;
    if(fv.st==="ag")return v.st==="ag";if(fv.st==="rec")return v.st!=="ag"&&v.pg===false;if(fv.st==="pago")return v.st!=="ag"&&v.pg!==false;return true};
  const l=S.vendas.filter(ok),ag=l.filter(v=>v.st==="ag").sort((a,b)=>(a.de||"9").localeCompare(b.de||"9")),cc=l.filter(v=>v.st!=="ag").reverse(),tot=cc.reduce((a,v)=>a+v.q*v.pv,0);
  return `<div class="mut" style="margin-bottom:8px">A receber (geral): <b>${brl(S.vendas.filter(v=>v.pg===false).reduce((a,v)=>a+v.q*v.pv,0))}</b><br>Neste filtro: ${cc.length} concluída(s), <b>${brl(tot)}</b>${ag.length?" · "+ag.length+" agendada(s), fora do total":""}</div><div class="card">${[...ag,...cc.slice(0,nVend)].map(vendaCard).join("")||'<span class="mut">Nenhuma venda encontrada.</span>'}</div>${cc.length>nVend?`<button class="b" style="width:100%" onclick="maisVend()">Ver mais vendas (${cc.length-nVend})</button>`:""}`}
let sheet=null,sheetOn=false,skipPop=0;
const UN=["kg","g","L","ml","un","dúzia","pacote"],fx=v=>Math.round(v*1e6)/1e6;
const rendBk=()=>{if(!sheet)render()};
function abrir(t,fn,keep,foot){sheet={fn,keep:!!keep};$("sheet-f").innerHTML=foot||"";$("sheet-t").textContent=t;const h=fn();$("sheet-b").innerHTML=h===null?"":h;$("sheet").style.display="block";$("sheet").scrollTop=0;document.body.style.overflow="hidden";if(!sheetOn){history.pushState({sh:1},"");sheetOn=true}}
function hideSheet(){sheetOn=false;sheet=null;$("sheet").style.display="none";$("sheet-b").innerHTML="";$("sheet-f").innerHTML="";document.body.style.overflow=""}
function fechar(){if(!sheetOn)return;hideSheet();skipPop++;history.back()}
addEventListener("popstate",()=>{if(skipPop>0){skipPop--;return}if(sheetOn)hideSheet()});
const atalhos=()=>`<div class="acoes"><button class="b" onclick="abrirVenda()">＋ Nova venda</button><button class="b" onclick="abrirProducao()">＋ Produção</button><button class="s" onclick="abrirMov(null,'e')">＋ Compra</button><button class="s" onclick="abrirMov()">Movimento</button></div>`;

function abrirNovoItem(){abrir("Novo item",()=>`<div class="card"><div class="row"><div><label>Nome</label><input id="in" placeholder="Farinha de trigo" autocomplete="off"></div>
  <div><label>Unidade</label><select id="iu">${UN.map(x=>`<option>${x}</option>`).join("")}</select></div>
  <div><label>Estoque mínimo</label><input id="im" inputmode="decimal" value="0"></div>
  <div><label>Custo por unidade (R$)</label><input id="ic" inputmode="decimal" value="0"></div>
  <button class="b" onclick="addInsumo()">Cadastrar item</button></div></div>`)}
function msal(){const i=ins(g("mi"));$("msal").textContent=i?"Saldo atual: "+num(saldo(i.id))+" "+i.un:""}
function abrirMov(i,t){if(!S.insumos.length)return toast("Cadastre um item primeiro.");t=t||"e";
  abrir(t==="e"&&!i?"Registrar compra":"Movimento de estoque",()=>{const cur=ins(i)||S.insumos[0];return `<div class="card"><div class="row"><div><label>Item</label><select id="mi" onchange="msal()">${S.insumos.map(x=>`<option value="${x.id}" ${x.id===cur.id?"selected":""}>${esc(x.nome)} (${esc(x.un)})</option>`).join("")}</select><div class="mut" id="msal" style="margin-top:4px">Saldo atual: ${num(saldo(cur.id))} ${esc(cur.un)}</div></div>
  <div><label>Tipo</label><select id="mt"><option value="e" ${t==="e"?"selected":""}>Entrada (compra)</option><option value="s" ${t==="s"?"selected":""}>Saída (perda, uso)</option><option value="c" ${t==="c"?"selected":""}>Contagem (acertar saldo)</option></select></div>
  <div><label>Quantidade</label><input id="mq" inputmode="decimal"></div>
  <div><label>Novo custo por unidade (só entrada)</label><input id="mc" inputmode="decimal"></div>
  <div><label>Observação</label><input id="mo"></div>
  <button class="b" onclick="movimento()">Registrar</button></div></div>`})}
function abrirItemEd(id){const i0=ins(id);if(!i0)return;abrir("Editar item",()=>{const i=ins(id),us=UN.includes(i.un)?UN:[...UN,i.un];return `<div class="card"><div class="row"><div><label>Nome</label><input id="ien" value="${esc(i.nome)}"></div>
  <div><label>Unidade</label><select id="ieu">${us.map(x=>`<option ${x===i.un?"selected":""}>${esc(x)}</option>`).join("")}</select><div class="mut" style="margin-top:4px">Mudar a unidade não converte as quantidades já lançadas.</div></div>
  <div><label>Estoque mínimo</label><input id="iem" inputmode="decimal" value="${fx(i.min)}"></div>
  <div><label>Custo por unidade (R$)</label><input id="iec" inputmode="decimal" value="${fx(i.custo)}"></div>
  <button class="b" onclick="salvarItem('${id}')">Salvar alterações</button>
  <button class="l" onclick="delInsumo('${id}')">Excluir item</button></div></div>`})}
function salvarItem(id){const i=ins(id);if(!i)return;const nome=g("ien").trim();if(!nome)return toast("Informe o nome do item.");
  const mn=n("iem"),c=n("iec");if(mn<0||c<0)return toast("Mínimo e custo não podem ser negativos.");i.nome=nome;i.un=g("ieu");i.min=mn;i.custo=c;save()}
function abrirMovEd(id){const m0=S.mov.find(a=>a.id===id);if(!m0||m0.ref)return;
  abrir(compra(m0)?"Editar compra":"Editar movimento",()=>{const m=S.mov.find(a=>a.id===id);if(!m)return null;const it=ins(m.i)||{nome:"?",un:""},cp=compra(m);
  return `<div class="card"><b>${esc(it.nome)}</b><div class="mut">Saldo atual: ${num(saldo(m.i))} ${esc(it.un)}</div></div>
  <div class="card"><div class="row"><div><label>Data</label><input id="ed" type="date" value="${m.d}"></div>
  <div><label>Quantidade (${esc(it.un)})${cp?"":" · negativo é saída"}</label><input id="eq" inputmode="decimal" value="${fx(m.q)}"></div>
  ${cp?`<div><label>Custo por ${esc(it.un)} (R$)</label><input id="ec" inputmode="decimal" value="${m.c||""}"></div>`:""}
  <div><label>Observação</label><input id="eo" value="${esc(m.o)}"></div>
  <button class="b" onclick="salvarMov('${m.id}')">Salvar alterações</button>
  <button class="l" onclick="delMov('${m.id}')">Excluir</button></div></div>`})}
function salvarMov(id){const m=S.mov.find(a=>a.id===id);if(!m||m.ref)return;const d=g("ed"),q=n("eq"),o=g("eo").trim()||"Ajuste";
  if(!d)return toast("Informe a data.");if(q===0)return toast("A quantidade não pode ser zero.");
  if(saldo(m.i)-m.q+q<-1e-9)return toast("Isso deixaria o estoque negativo.");
  const cp=compra(m);m.d=d;m.q=q;m.o=o;if(q<0&&m.t!=="c")m.t="s";if(q>0&&m.t==="s")m.t="e";
  if(cp&&$("ec")){const c=n("ec");m.c=c>0?c:undefined;const ult=S.mov.filter(a=>a.i===m.i&&compra(a)).pop();if(ult===m&&m.c&&ins(m.i))ins(m.i).custo=m.c}
  save()}
function abrirProducao(){if(!S.prod.length)return toast("Cadastre produtos na aba Fichas.");
  abrir("Registrar produção",()=>`<div class="card"><div class="mut" style="margin-bottom:8px">Os ingredientes saem do estoque e os produtos entram como prontos.</div><div class="row"><div><label>Produto</label><select id="xp">${opts(S.prod,p=>p.nome)}</select></div>
  <div><label>Unidades produzidas</label><input id="xq" inputmode="decimal"></div><button class="b" onclick="produzir()">Registrar produção</button></div></div>`)}
function abrirProdEd(id){if(!S.producoes.find(a=>a.id===id))return;
  abrir("Editar produção",()=>{const x=S.producoes.find(a=>a.id===id);if(!x)return null;return `<div class="card"><b>${esc((pr(x.p)||{nome:"?"}).nome)}</b><div class="mut">Os ingredientes do estoque são ajustados junto.</div></div>
  <div class="card"><div class="row"><div><label>Data</label><input id="pd" type="date" value="${x.d}"></div>
  <div><label>Unidades produzidas</label><input id="pq" inputmode="decimal" value="${fx(x.q)}"></div>
  <button class="b" onclick="salvarProducao('${id}')">Salvar alterações</button>
  <button class="l" onclick="delProducao('${id}')">Desfazer produção</button></div></div>`})}
function salvarProducao(id){const x=S.producoes.find(a=>a.id===id);if(!x)return;const d=g("pd"),v=n("pq");
  if(!d)return toast("Informe a data.");if(v<=0)return toast("A quantidade deve ser maior que zero.");
  const r=v/x.q,ms=S.mov.filter(m=>m.ref===id);
  if(r<1&&pronto(x.p)-(x.q-v)<-1e-9)return toast("Parte desta produção já foi vendida.");
  if(r>1){const f=ms.filter(m=>saldo(m.i)<-m.q*(r-1)-1e-9);if(f.length)return toast("Falta estoque: "+f.map(m=>(ins(m.i)||{nome:"?"}).nome).join(", "))}
  ms.forEach(m=>{m.q*=r;m.d=d});x.q=v;x.d=d;save()}
function abrirNovoProd(){abrir("Novo produto",()=>`<div class="card"><div class="row"><div><label>Nome</label><input id="pn" placeholder="Pão de queijo" autocomplete="off"></div>
  <div><label>Preço de venda (R$)</label><input id="pp" inputmode="decimal"></div>
  <div><label>Rendimento da receita (unidades)</label><input id="pr" inputmode="decimal" value="1"></div>
  <button class="b" onclick="addProd()">Cadastrar produto</button></div></div>`)}
const fichaHTML=id=>{const p=pr(id);if(!p)return null;
  const tot=p.f.reduce((a,x)=>a+x.q*((ins(x.i)||{}).custo||0),0),c=custoProd(p),mg=p.preco?Math.round((p.preco-c)/p.preco*100):0;
  const linhas=p.f.map(x=>{const i=ins(x.i)||{nome:"?",un:"",custo:0};
    return `<tr><td><select aria-label="Ingrediente" onchange="trocaIng('${p.id}','${x.i}',this.value)">${S.insumos.map(o=>`<option value="${o.id}" ${o.id===x.i?"selected":""}>${esc(o.nome)}</option>`).join("")}</select></td>
    <td><input inputmode="decimal" aria-label="Quantidade" value="${x.q}" onchange="editQtd('${p.id}','${x.i}',this.value)"> <span class="mut">${esc(i.un)}</span></td>
    <td>${brl(x.q*i.custo)}</td>
    <td><button class="l" aria-label="Remover ${esc(i.nome)}" onclick="delFicha('${p.id}','${x.i}')">✕</button></td></tr>`}).join("");
  const novo=`<tr class="novo"><td><select id="fi${p.id}" aria-label="Novo ingrediente" onchange="$('fu${p.id}').textContent=(ins(this.value)||{un:''}).un"><option value="">Ingrediente</option>${S.insumos.map(o=>`<option value="${o.id}">${esc(o.nome)}</option>`).join("")}</select></td>
    <td><input id="fq${p.id}" inputmode="decimal" placeholder="Quantidade" aria-label="Quantidade do novo ingrediente"> <span class="mut" id="fu${p.id}"></span></td>
    <td colspan="2"><button class="b" style="width:100%;min-height:42px;padding:6px 10px" onclick="addFicha('${p.id}')">Adicionar</button></td></tr>`;
  return `<div class="card"><b>Dados do produto</b><div class="row" style="margin-top:8px"><div><label>Nome</label><input value="${esc(p.nome)}" onchange="editProd('${p.id}','nome',this.value)"></div>
  <div><label>Preço de venda (R$)</label><input inputmode="decimal" value="${p.preco}" onchange="editProd('${p.id}','preco',this.value)"></div>
  <div><label>Rendimento da receita (unidades)</label><input inputmode="decimal" value="${p.r}" onchange="editProd('${p.id}','r',this.value)"></div></div></div>
  <p class="mut">Cada linha diz quanto do ingrediente é usado em uma receita, que rende ${num(p.r)} unidade(s). O custo usa o custo cadastrado de cada item no estoque.</p>
  <div class="card tw" style="padding:6px"><table class="ft"><thead><tr><th>Ingrediente</th><th>Quantidade</th><th>Custo</th><th></th></tr></thead><tbody>${linhas}${novo}
  <tr class="total"><td colspan="2">Custo da receita</td><td>${brl(tot)}</td><td></td></tr>
  <tr class="total"><td colspan="2">Custo por unidade (rende ${num(p.r)})</td><td>${brl(c)}</td><td></td></tr></tbody></table></div>
  <p class="mut">Preço de venda ${brl(p.preco)} · lucro por unidade ${brl(p.preco-c)} · margem ${mg}%</p>`};
function salvarFicha(id){const i=g("fi"+id),q=n("fq"+id);
  if(i&&q>0)addFicha(id);
  else if(i||q>0)return toast("Complete o ingrediente e a quantidade, ou deixe os dois em branco.");
  fechar()}
const nomeKey=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
function abrirCopia(id){const p=pr(id);if(!p)return;abrir("Copiar ficha",()=>`<div class="card"><div class="mut">Copiando a ficha de</div><b>${esc(p.nome)}</b><div class="mut" style="margin-top:6px">${p.f.length} ingr. · rendimento ${num(p.r)} · preço ${brl(p.preco)}</div></div>
  <div class="card"><div class="row"><div><label>Nome do novo produto (diferente dos existentes)</label><input id="cn" placeholder="Ex.: ${esc(p.nome)} integral" autocomplete="off"></div>
  <button class="b" onclick="copiarFicha('${id}')">Criar cópia e editar</button></div></div>
  <p class="mut">A cópia vem com os mesmos ingredientes, quantidades, rendimento e preço. Depois é só alterar o que for diferente.</p>`)}
function copiarFicha(id){const p=pr(id);if(!p)return;const nome=g("cn").trim();
  if(!nome)return toast("Informe o nome da nova ficha.");
  if(S.prod.some(x=>nomeKey(x.nome)===nomeKey(nome)))return toast("Já existe um produto com esse nome. Use um nome diferente.");
  const nid=uid();S.prod.push({id:nid,nome,preco:p.preco,r:p.r,f:p.f.map(x=>({i:x.i,q:x.q}))});save();abrirFicha(nid)}
function abrirFicha(id){const p=pr(id);if(!p)return;abrir(p.nome,()=>fichaHTML(id),true,`<div class="acoes"><button class="s" onclick="abrirCopia('${id}')">Copiar ficha</button><button class="b" onclick="salvarFicha('${id}')">Salvar</button></div><button class="l" style="width:100%" onclick="delProd('${id}')">Excluir produto</button>`)}
function abrirPlano(){if(!S.prod.length)return toast("Cadastre produtos primeiro.");
  abrir("Previsão de produção",()=>`<div class="card"><div class="mut" style="margin-bottom:8px">Quantas unidades pretende produzir?</div><div class="row">${S.prod.map(p=>`<div><label>${esc(p.nome)}</label><input inputmode="decimal" value="${S.plano[p.id]||""}" onchange="setPlano('${p.id}',this.value)"></div>`).join("")}</div></div>`,true)}
function abrirVenda(){if(!S.prod.length)return toast("Cadastre produtos na aba Fichas.");abrir("Registrar venda",()=>`<div class="card"><b>Registrar venda</b><div class="mut">Venda agora abate o estoque na hora. Encomenda agendada abate só quando você concluir a entrega.</div>
  <div class="row"><div><label>Tipo</label><select id="vt" onchange="if(this.value==='ag'){$('vf').value='Outro';$('vg').value='n'}"><option value="ok">Vender agora</option><option value="ag">Agendar encomenda</option></select></div><div><label>Produto</label><select id="vp" onchange="preencher()">${S.prod.map(p=>`<option value="${p.id}">${esc(p.nome)} (${num(pronto(p.id))} prontos)</option>`).join("")}</select></div>
  <div><label>Quantidade</label><input id="vq" inputmode="decimal" value="1"></div>
  <div><label>Preço unitário (R$)</label><input id="vv" inputmode="decimal" value="${S.prod[0]?S.prod[0].preco:0}"></div>
  <div><label>Nome do cliente</label><input id="vc" placeholder="Maria"></div>
  <div><label>Data da encomenda</label><input id="vd" type="date" value="${hoje()}"></div>
  <div><label>Data da entrega</label><input id="ve" type="date" value="${hoje()}"></div>
  <div><label>Forma de pagamento</label><select id="vf"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Outro</option></select></div>
  <div><label>Já pagou?</label><select id="vg"><option value="s">Sim</option><option value="n">Não</option></select></div>
  <button class="b" onclick="vender()">Registrar venda</button></div></div>`)}
function delProd(id){if(S.producoes.some(p=>p.p===id)||S.vendas.some(v=>v.p===id))return toast("Produto com produção ou vendas não pode ser excluído.");S.prod=S.prod.filter(p=>p.id!==id);save()}
function falta(p,q){return p.f.map(x=>({x,need:x.q*q/p.r})).filter(o=>saldo(o.x.i)<o.need-1e-9)}
function produzir(){const p=pr(g("xp")),q=n("xq");if(!p||q<=0)return toast("Escolha o produto e a quantidade.");
  if(!p.f.length)return toast("Este produto não tem ficha técnica.");
  const f=falta(p,q);if(f.length)return toast("Falta estoque: "+f.map(o=>ins(o.x.i).nome).join(", "));
  const id=uid();S.producoes.push({id,p:p.id,q,d:hoje()});
  p.f.forEach(x=>S.mov.push({id:uid(),i:x.i,q:-(x.q*q/p.r),d:hoje(),o:"Produção: "+p.nome,ref:id}));save()}
function delProducao(id){const x=S.producoes.find(a=>a.id===id);if(pronto(x.p)<x.q)return toast("Parte desta produção já foi vendida.");S.producoes=S.producoes.filter(a=>a.id!==id);S.mov=S.mov.filter(m=>m.ref!==id);save()}
function vender(){const p=pr(g("vp")),q=n("vq");if(!p||q<=0)return toast("Escolha o produto e a quantidade.");
  const ag=g("vt")==="ag";if(!ag&&pronto(p.id)<q)return toast("Só há "+num(pronto(p.id))+" un. de "+p.nome+" prontas.");
  S.vendas.push({id:uid(),p:p.id,q,pv:n("vv"),c:custoProd(p),d:g("vd")||hoje(),de:g("ve"),cli:g("vc").trim(),fp:g("vf"),pg:g("vg")==="s",st:ag?"ag":"ok"});save()}
function concluir(id,pago){const v=S.vendas.find(a=>a.id===id),p=pr(v.p);if(pronto(v.p)<v.q)return toast("Só há "+num(pronto(v.p))+" un. de "+p.nome+" prontas. Registre a produção antes.");v.st="ok";v.fp=g("fp"+id);v.pg=pago;v.c=custoProd(p);save()}
function lembretes(){const ag=S.vendas.filter(v=>v.st==="ag").sort((a,b)=>(a.de||"9").localeCompare(b.de||"9"));if(!ag.length)return "";
  const h=hoje(),am=new Date(Date.now()-new Date().getTimezoneOffset()*6e4+864e5).toISOString().slice(0,10),need={};ag.forEach(v=>need[v.p]=(need[v.p]||0)+v.q);
  const ps=Object.keys(need).map(id=>({p:pr(id),n:need[id],t:pronto(id)})).filter(o=>o.p);
  const prazo=d=>!d?"":d<h?'<span class="tag bad">Atrasada</span>':d===h?'<span class="tag bad">Hoje</span>':d===am?'<span class="tag">Amanhã</span>':"";
  return `<h2>Lembretes de produção</h2><div class="card">${ps.map(o=>{const f=Math.max(0,o.n-o.t),inf=`<span class="mut">(encomendas ${num(o.n)}, prontas ${num(o.t)})</span>`;return `<div><b>${esc(o.p.nome)}</b>: ${f?`produzir <b>${num(f)} un.</b> ${inf}`:`<span class="tag ok">estoque cobre</span> ${inf}`}</div>`}).join("")}<div class="mut" style="margin-top:8px">Próximas entregas</div>${ag.slice(0,8).map(v=>`<div>${v.de?dt(v.de):"sem data"} ${prazo(v.de)} · ${esc((pr(v.p)||{nome:"?"}).nome)} ${num(v.q)} un.${v.cli?" · "+esc(v.cli):""}</div>`).join("")}</div>`}
function togglePago(id){const v=S.vendas.find(a=>a.id===id);v.pg=v.pg===false;save()}
function delVenda(id){S.vendas=S.vendas.filter(v=>v.id!==id);save()}
function setPlano(id,v){S.plano[id]=parseFloat(String(v).replace(",","."))||0;save()}
const preencher=()=>{const p=pr(g("vp"));if(p)$("vv").value=p.preco};

/* ---------- Telas ---------- */
const V={};
V.painel=()=>{const h=hoje(),m=h.slice(0,7),vs=f=>S.vendas.filter(v=>v.st!=="ag"&&f(v)),t=(l,k)=>l.reduce((a,v)=>a+k(v),0);
  const d=vs(v=>v.d===h),ms=vs(v=>v.d.slice(0,7)===m),fat=t(ms,v=>v.q*v.pv),luc=fat-t(ms,v=>v.q*v.c);
  const baixos=S.insumos.filter(i=>saldo(i.id)<=i.min);
  const top=S.prod.map(p=>({p,q:t(S.vendas.filter(v=>v.p===p.id&&v.st!=="ag"),v=>v.q)})).filter(o=>o.q>0).sort((a,b)=>b.q-a.q).slice(0,5);
  return `${avisoBk()}${atalhos()}${lembretes()}<div class="grid">
  <div class="card stat"><b>${brl(t(d,v=>v.q*v.pv))}</b><span>Vendas de hoje</span></div>
  <div class="card stat"><b>${brl(fat)}</b><span>Vendas do mês</span></div>
  <div class="card stat"><b>${brl(luc)}</b><span>Lucro estimado no mês</span></div>
  <div class="card stat"><b>${fat?Math.round(luc/fat*100):0}%</b><span>Margem do mês</span></div></div>
  ${graficoMeses()}<h2>Itens para repor</h2><div class="card">${baixos.length?baixos.map(i=>`<div>${esc(i.nome)}: <b>${num(saldo(i.id))} ${i.un}</b> <span class="mut">(mínimo ${num(i.min)})</span></div>`).join(""):'<span class="mut">Nenhum item abaixo do mínimo.</span>'}</div>
  <h2>Produtos prontos para vender</h2><div class="card">${S.prod.length?S.prod.map(p=>`<div>${esc(p.nome)}: <b>${num(pronto(p.id))} un.</b></div>`).join(""):'<span class="mut">Cadastre produtos na aba Fichas.</span>'}</div>
  <h2>Mais vendidos</h2><div class="card">${top.length?top.map(o=>`<div>${esc(o.p.nome)}: <b>${num(o.q)} un.</b></div>`).join(""):'<span class="mut">Sem vendas registradas.</span>'}</div>`};

V.estoque=()=>{const l=S.mov.slice().reverse();
  return `<div class="acoes"><button class="b" onclick="abrirNovoItem()">＋ Novo item</button><button class="b" onclick="abrirMov()">Registrar movimento</button></div>
  <h2>Saldo atual</h2>${S.insumos.length?S.insumos.map(i=>{const sd=saldo(i.id);return `<div class="card"><div class="lin"><b>${esc(i.nome)}</b>${sd<=i.min?'<span class="tag bad">repor</span>':'<span class="tag ok">ok</span>'}</div><div style="font-size:20px;font-weight:800">${num(sd)} ${esc(i.un)}</div><div class="mut">Mínimo ${num(i.min)} · custo ${brl(i.custo)} por ${esc(i.un)}</div><div class="acoes" style="margin:10px 0 0"><button class="s" onclick="abrirItemEd('${i.id}')">Editar item</button><button class="s" onclick="abrirMov('${i.id}','e')">Movimentar</button></div></div>`}).join(""):'<div class="card"><span class="mut">Toque em Novo item para cadastrar o primeiro.</span></div>'}
  <h2>Movimentos de estoque</h2>${l.length?l.slice(0,nMov).map(m=>{const it=ins(m.i)||{nome:"?",un:""};return `<div class="card"><div class="lin"><b>${esc(it.nome)}</b><span class="mut">${dt(m.d)}</span></div><div class="lin" style="margin-top:6px"><span><b style="color:var(${m.q<0?"--bad":"--brand"})">${m.q>0?"+":""}${num(m.q)} ${esc(it.un)}</b> <span class="mut">${esc(m.o)}</span></span>${m.ref?'<span class="mut">Edite na aba Produção</span>':`<button class="s" onclick="abrirMovEd('${m.id}')">Editar</button>`}</div></div>`}).join("")+(l.length>nMov?`<button class="b" style="width:100%" onclick="maisMov()">Ver mais movimentos (${l.length-nMov})</button>`:""):'<div class="card"><span class="mut">Sem movimentos.</span></div>'}`};

V.fichas=()=>`<div class="acoes"><button class="b" onclick="abrirNovoProd()">＋ Novo produto</button></div>
  <h2>Produtos</h2>${S.prod.length?S.prod.map(p=>{const c=custoProd(p),mg=p.preco?Math.round((p.preco-c)/p.preco*100):0;return `<div class="card"><div class="lin"><b>${esc(p.nome)}</b><span class="tag ${mg<0?"bad":"ok"}">margem ${mg}%</span></div><div class="mut">${p.f.length} ingr. · custo ${brl(c)} · preço ${brl(p.preco)}</div><div class="acoes" style="margin:10px 0 0"><button class="s" onclick="abrirFicha('${p.id}')">Abrir ficha técnica</button><button class="s" onclick="abrirCopia('${p.id}')">Copiar ficha</button></div></div>`}).join(""):'<div class="card"><span class="mut">Toque em Novo produto para cadastrar o primeiro.</span></div>'}`;

V.producao=()=>{const l=S.producoes.slice().reverse();
  return `<div class="acoes"><button class="b" onclick="abrirProducao()">＋ Registrar produção</button></div>
  <h2>Histórico</h2>${l.length?l.slice(0,nProd).map(x=>`<div class="card"><div class="lin"><b>${esc((pr(x.p)||{nome:"?"}).nome)}</b><span class="mut">${dt(x.d)}</span></div><div class="lin" style="margin-top:6px"><b>${num(x.q)} un.</b><button class="s" onclick="abrirProdEd('${x.id}')">Editar</button></div></div>`).join("")+(l.length>nProd?`<button class="b" style="width:100%" onclick="maisProd()">Ver mais produções (${l.length-nProd})</button>`:""):'<div class="card"><span class="mut">Nenhuma produção.</span></div>'}`};

V.vendas=()=>`<div class="acoes"><button class="b" onclick="abrirVenda()">＋ Registrar venda</button></div>
  <h2>Vendas</h2>
  <div class="card"><div class="row"><div><label>Buscar cliente ou produto</label><input type="search" value="${esc(fv.q)}" oninput="fvSet('q',this.value)" placeholder="Maria, pão de queijo..."></div>
  <div><label>Período</label><select onchange="fvSet('per',this.value)">${[["todas","Todos"],["hoje","Hoje"],["sem","Últimos 7 dias"],["mes","Este mês"]].map(o=>`<option value="${o[0]}" ${fv.per===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>
  <div><label>Situação</label><select onchange="fvSet('st',this.value)">${[["todas","Todas"],["ag","Agendadas"],["rec","A receber"],["pago","Pagas"]].map(o=>`<option value="${o[0]}" ${fv.st===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div></div></div>
  <div id="vres">${vendasLista()}</div>`;

V.compras=()=>{const need={};S.prod.forEach(p=>p.f.forEach(x=>need[x.i]=(need[x.i]||0)+x.q*(S.plano[p.id]||0)/p.r));
  const rows=S.insumos.filter(i=>need[i.id]>0).map(i=>({i,nd:need[i.id],buy:Math.max(0,need[i.id]-saldo(i.id))})),pl=S.prod.filter(p=>S.plano[p.id]>0),l=S.mov.filter(compra).reverse();
  return `<div class="acoes"><button class="b" onclick="abrirMov(null,'e')">＋ Registrar compra</button><button class="s" onclick="abrirPlano()">Previsão de produção</button></div>
  <div class="mut" style="margin-bottom:8px">${pl.length?"Previsão: "+pl.map(p=>esc(p.nome)+" "+num(S.plano[p.id])).join(" · "):"Nenhuma previsão definida."}</div>
  <h2>Necessidade de compra</h2><div class="card tw">${rows.length?`<table><tr><th>Item</th><th>Precisa</th><th>Tem</th><th>Comprar</th><th>Custo</th></tr>${rows.map(o=>`<tr><td>${esc(o.i.nome)}</td><td>${num(o.nd)} ${esc(o.i.un)}</td><td>${num(saldo(o.i.id))}</td><td><b>${o.buy?num(o.buy)+" "+esc(o.i.un):"—"}</b></td><td>${brl(o.buy*o.i.custo)}</td></tr>`).join("")}</table>
  <p><b>Total estimado: ${brl(rows.reduce((a,o)=>a+o.buy*o.i.custo,0))}</b></p>`:'<span class="mut">Defina a previsão de produção para ver o que comprar.</span>'}</div>
  <h2>Compras realizadas</h2>${l.length?l.slice(0,nCompras).map(m=>{const i=ins(m.i)||{nome:"?",un:""};return `<div class="card"><div class="lin"><b>${esc(i.nome)}</b><span class="mut">${dt(m.d)}</span></div><div class="lin" style="margin-top:6px"><span>${num(m.q)} ${esc(i.un)}${m.c?" · "+brl(m.c)+" por "+esc(i.un)+" · total "+brl(m.q*m.c):""}</span><button class="s" onclick="abrirMovEd('${m.id}')">Editar</button></div>${m.o&&m.o!=="Entrada"?`<div class="mut">${esc(m.o)}</div>`:""}</div>`}).join("")+(l.length>nCompras?`<button class="b" style="width:100%" onclick="mais()">Ver mais compras (${l.length-nCompras})</button>`:""):'<div class="card"><span class="mut">Nenhuma compra registrada. Toque em Registrar compra.</span></div>'}`};

V.backup=()=>`<div class="card"><b>Backup automático</b><p class="mut">${esc(bkMsg)}</p>
  <p class="mut">Último backup baixado: ${ultBk()?dt(ultBk())+" (há "+diasBk()+" dia(s))":"nenhum ainda"}.</p>
  <p class="mut">Depois de escolher a pasta, cada alteração grava um arquivo atual e um arquivo do dia. Funciona no Chrome ou Edge no computador. Em outros aparelhos, baixe o arquivo manualmente.</p>
  <div class="row"><button class="b" onclick="escolherPasta()">Escolher pasta de backup</button>
  ${needPerm?'<button class="b" onclick="reativar()">Reativar pasta</button>':""}
  ${dir?'<button class="b" onclick="fazerBackup()">Fazer backup agora</button>':""}
  <button class="b" onclick="baixar()">Baixar backup</button></div></div>
  <div class="card"><b>Restaurar</b><p class="mut">Substitui todos os dados atuais pelos do arquivo.</p><input type="file" accept=".json" onchange="restaurar(event)"></div>`;

const TABS=[["painel","Painel"],["estoque","Estoque"],["fichas","Fichas"],["producao","Produção"],["vendas","Vendas"],["compras","Compras"],["backup","Backup"]];
function render(){$("nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${t[1]}</button>`).join("");$("v").innerHTML=V[tab]();if(sheet&&sheet.keep){const h=sheet.fn();if(h===null)fechar();else $("sheet-b").innerHTML=h}}
render();
hget().then(async h=>{if(!h)return;dir=h;try{needPerm=(await h.queryPermission({mode:"readwrite"}))!=="granted"}catch(e){}bkMsg=needPerm?"Pasta “"+h.name+"” salva. Toque em “Reativar pasta” para continuar os backups.":"Pasta de backup: “"+h.name+"”.";render()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
